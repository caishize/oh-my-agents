# oh-my-agents — plugin self-tests (the constitution, mechanically enforced)
#
# Until v3.11.0 every "CI-enforced" claim in CLAUDE.md / docs/INTEGRATION.md described
# tests nobody ran automatically: this repository had no .github/ directory at all.
# Two jobs, no secrets:
#   tests     — tests/test-hooks.sh + tests/test-skills.sh + tests/test-antigravity.sh + node --check
#   validate  — Antigravity manifest/hook/rule strict validation (plus `agy plugin validate --strict`
#               when `agy` v1.4.7+ is present on the runner) and `claude plugin validate --strict`
#               with real failure propagation.

name: plugin-tests

on:
  pull_request:
  push:
    branches: [main, gemini]

jobs:
  tests:
    name: hook + skill + antigravity tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain present (bash, jq, python3, node, flock)
        run: |
          bash --version | head -1; jq --version; python3 --version; node --version; command -v flock
      - name: Hook tests
        run: bash tests/test-hooks.sh
      - name: Skill + constitution tests
        run: bash tests/test-skills.sh
      - name: Antigravity adapter & distribution tests
        run: bash tests/test-antigravity.sh
      - name: Workflow parses
        run: node --check workflows/harness-audit.js

  validate:
    name: plugin validate --strict (Antigravity + Claude Code)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Antigravity plugin layout (tested against agy 1.4.7)
        run: |
          if command -v agy >/dev/null 2>&1; then
            out=$(agy plugin validate . --strict --json)
            printf '%s\n' "$out"
            python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["findings"]==[], d["findings"]' "$out"
          else
            echo "agy CLI not pre-installed on runner; running strict structural & adapter checks via test-antigravity.sh"
            bash tests/test-antigravity.sh
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate Claude plugin manifest (strict; real failure propagation)
        run: python3 tests/validate-claude-plugin.py .claude-plugin/plugin.json
