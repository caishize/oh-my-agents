name: codex-plugin-tests
on:
  pull_request:
  push:
    branches: [codex]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prerequisites
        run: |
          for tool in bash git jq python3 flock; do command -v "$tool"; done
      - name: Deterministic hook behavior
        run: bash tests/test-hooks.sh
      - name: Native payloads, package contracts and explicit gates
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install the validated Codex CLI
        run: npm install -g @openai/codex@0.162.1
      - name: Real Codex installation and discovery
        run: bash tests/test-plugin-install.sh
