# Copy into the target project and set real commands from AGENTS.md.
# Unset commands fail; this template never reports passing TODO checks.
name: Harness Check
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HARNESS_SETUP_CMD: ""
      HARNESS_LINT_CMD: ""
      HARNESS_TEST_CMD: ""
      HARNESS_ARCH_CMD: ""
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          : "${HARNESS_SETUP_CMD:?Set the real setup command from AGENTS.md}"
          bash -euo pipefail -c "$HARNESS_SETUP_CMD"
      - name: Lint
        run: |
          : "${HARNESS_LINT_CMD:?Set the real lint command from AGENTS.md}"
          bash -euo pipefail -c "$HARNESS_LINT_CMD"
      - name: Tests
        run: |
          : "${HARNESS_TEST_CMD:?Set the real test command from AGENTS.md}"
          bash -euo pipefail -c "$HARNESS_TEST_CMD"
      - name: Architecture
        run: |
          : "${HARNESS_ARCH_CMD:?Set the real architecture command from AGENTS.md}"
          bash -euo pipefail -c "$HARNESS_ARCH_CMD"
