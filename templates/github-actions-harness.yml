# GitHub Actions — Harness Engineering CI
#
# Generated by oh-my-agents /harness-init. Runs three enforcement tiers on every PR:
#   1. Lint & format (fastest — catches style violations)
#   2. Type check (catches type errors)
#   3. Architecture guard (structural tests enforcing TASTE/ARCH rules)
#
# Copy to .github/workflows/harness.yml in your project.
# Adapt the commands to match your stack (see CLAUDE.md for entry points).

name: Harness Check

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  harness:
    name: Harness Enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup (adapt to your stack)
        run: |
          # Python projects:
          # pip install -r requirements.txt
          # pip install -r requirements-dev.txt
          #
          # Node.js projects:
          # npm ci
          #
          # Or use your bootstrap script:
          # bash scripts/bootstrap.sh
          echo "TODO: replace with your setup command"

      # ── Tier 1: Lint & Format ──────────────────────────────────────────────
      - name: Lint & Format
        id: lint
        run: |
          # Python (ruff):
          # ruff check src/ && ruff format --check src/
          #
          # TypeScript (eslint + prettier):
          # npx eslint src/ && npx prettier --check src/
          #
          # Or your unified check:
          # npm run lint
          echo "TODO: replace with your lint command"

      # ── Tier 2: Type Check ─────────────────────────────────────────────────
      - name: Type Check
        id: typecheck
        run: |
          # Python (mypy):
          # mypy src/
          #
          # TypeScript (tsc):
          # npx tsc --noEmit
          echo "TODO: replace with your type-check command"

      # ── Tier 3: Architecture Guard ────────────────────────────────────────
      - name: Architecture Guard
        id: arch
        run: |
          # Python:
          # pytest tests/test_architecture.py -x -q
          #
          # TypeScript:
          # npx jest tests/architecture.test.ts --passWithNoTests
          echo "TODO: replace with your architecture test command"

      # ── Test Suite ────────────────────────────────────────────────────────
      - name: Tests
        id: tests
        run: |
          # Python:
          # pytest --tb=short -q
          #
          # TypeScript:
          # npm test
          echo "TODO: replace with your test command"

      # ── Harness Summary ───────────────────────────────────────────────────
      - name: Harness Summary
        if: always()
        run: |
          echo "## Harness Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Format | ${{ steps.lint.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check    | ${{ steps.typecheck.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Arch Guard    | ${{ steps.arch.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests         | ${{ steps.tests.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Powered by [oh-my-agents](https://github.com/your-org/oh-my-agents) harness engineering." >> $GITHUB_STEP_SUMMARY
